<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rzeczny Rajd</title>
<style>
  :root {
    --bg: #0d0f14;
    --fg: #e8e8e8;
    --btn: #2a2f3a;
    --btn-active: #4a5263;
    --accent: #e8d44d;
  }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 2px #000, 0 8px 32px rgba(0,0,0,.6);
  }
  #help { font-size: 12px; opacity: .7; text-align: center; padding: 0 16px; }
  #touch {
    display: none;
    width: 100%; max-width: 480px; box-sizing: border-box;
    padding: 0 16px;
    justify-content: space-between; align-items: center;
  }
  #touch .grp { display: flex; gap: 8px; }
  #touch .col { display: flex; flex-direction: column; gap: 8px; }
  #touch button {
    width: 64px; height: 56px;
    border: 0; border-radius: 12px;
    background: var(--btn); color: var(--fg);
    font: bold 22px ui-monospace, monospace;
    touch-action: none;
  }
  #touch button.on { background: var(--btn-active); }
  #touch button.fire { width: 88px; height: 120px; background: #7a2020; color: #fff; font-size: 18px; }
  #touch button.fire.on { background: #b03030; }
  #touch button.small { height: 56px; }
  body.touch #touch { display: flex; }
  body.touch #help { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="help">← → sterowanie &nbsp;·&nbsp; ↑ przyspiesz &nbsp;·&nbsp; ↓ zwolnij &nbsp;·&nbsp; SPACJA strzał &nbsp;·&nbsp; P pauza &nbsp;·&nbsp; M dźwięk</div>
  <div id="touch">
    <div class="grp">
      <button data-k="left" aria-label="lewo">◀</button>
      <button data-k="right" aria-label="prawo">▶</button>
    </div>
    <div class="col">
      <button data-k="up" class="small" aria-label="szybciej">▲</button>
      <button data-k="down" class="small" aria-label="wolniej">▼</button>
    </div>
    <button data-k="fire" class="fire" aria-label="strzał">OGIEŃ</button>
  </div>
</div>
<script>
'use strict';

// ---------- Stałe ----------
const W = 320, VH = 400, HUD = 64, H = VH + HUD;
const ROW = 8, CX = W / 2;
const BHW = 40;                 // połowa szerokości rzeki przy moście
const PY = VH - 64;             // ekranowa pozycja Y samolotu
const POFF = VH - PY;           // przesunięcie samolotu względem scrollY w świecie
const LAND = '#3f8f2f', WATER = '#2d3fb8', ROAD = '#5c5c5c';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- Sprite'y ----------
function makeSprite(rows, pal, scale = 2) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w * scale; c.height = h * scale;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const col = pal[rows[y][x]];
    if (col) { g.fillStyle = col; g.fillRect(x * scale, y * scale, scale, scale); }
  }
  return c;
}
function flip(s) {
  const c = document.createElement('canvas');
  c.width = s.width; c.height = s.height;
  const g = c.getContext('2d');
  g.translate(s.width, 0); g.scale(-1, 1); g.drawImage(s, 0, 0);
  return c;
}

const SPR = {};
SPR.plane = makeSprite([
  '....#....',
  '....#....',
  '...###...',
  '..##o##..',
  '.#######.',
  '#########',
  '#...#...#',
  '....#....',
  '...###...',
  '..#####..',
], { '#': '#e8d44d', 'o': '#7a6a10' });
SPR.ship = makeSprite([
  '.......ww.......',
  '......wwww......',
  '...rrrrrrrrrr...',
  '################',
  '.##############.',
  '..############..',
], { '#': '#1b1b1b', 'w': '#e0e0e0', 'r': '#b04020' });
SPR.shipL = flip(SPR.ship);
const heliA = [
  'oooooooooo..',
  '.....#......',
  '#...####w...',
  '##########..',
  '#...#####...',
  '....#...#...',
  '...######...',
  '............',
];
const heliB = heliA.slice(); heliB[0] = '...oooo.....';
const heliPal = { '#': '#1f5f1f', 'o': '#d8d8d8', 'w': '#9fd0ff' };
SPR.heli = [makeSprite(heliA, heliPal), makeSprite(heliB, heliPal)];
SPR.heliL = SPR.heli.map(flip);
SPR.jet = makeSprite([
  'oo..........',
  'ooo...##....',
  '############',
  'ooo...##....',
  'oo..........',
], { '#': '#e0e0e0', 'o': '#909090' });
SPR.jetL = flip(SPR.jet);
SPR.house = makeSprite([
  '...rrrr...',
  '..rrrrrr..',
  '.rrrrrrrr.',
  'rrrrrrrrrr',
  '.wwwwwwww.',
  '.wbwwwwdw.',
  '.wbwwwwdw.',
  '.wwwwwwdw.',
], { 'r': '#a03028', 'w': '#e8e0c8', 'b': '#3060a0', 'd': '#5a3a1a' });
SPR.tree = makeSprite([
  '..ggg..',
  '.ggggg.',
  'ggglggg',
  'gglgggg',
  '.ggggg.',
  '..ggg..',
  '...t...',
  '...t...',
], { 'g': '#1d5a17', 'l': '#2f7a24', 't': '#5a3a1a' });
SPR.fuel = (() => {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 40;
  const g = c.getContext('2d');
  g.fillStyle = '#c8302c'; g.fillRect(0, 0, 16, 40);
  g.fillStyle = '#f0f0f0';
  g.fillRect(0, 0, 16, 2); g.fillRect(0, 38, 16, 2);
  // litery F U E L w 3x5 pikselach (skala 2x... w pionie 1.6)
  const L = {
    F: ['###', '#..', '##.', '#..', '#..'],
    U: ['#.#', '#.#', '#.#', '#.#', '###'],
    E: ['###', '#..', '##.', '#..', '###'],
    L: ['#..', '#..', '#..', '#..', '###'],
  };
  'FUEL'.split('').forEach((ch, i) => {
    L[ch].forEach((row, y) => row.split('').forEach((p, x) => {
      if (p === '#') g.fillRect(5 + x * 2, 4 + i * 9 + y * 1.6, 2, 2);
    }));
  });
  return c;
})();

// ---------- Dźwięk ----------
const Snd = (() => {
  let ac = null, master, engOsc, engGain, engLp, noiseBuf, muted = false;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.22; master.connect(ac.destination);
      engOsc = ac.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 60;
      engLp = ac.createBiquadFilter(); engLp.type = 'lowpass'; engLp.frequency.value = 350;
      engGain = ac.createGain(); engGain.gain.value = 0;
      engOsc.connect(engLp); engLp.connect(engGain); engGain.connect(master);
      engOsc.start();
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function engine(on, spd) {
    if (!ac) return;
    const t = ac.currentTime;
    engGain.gain.setTargetAtTime(on && !muted ? 0.16 : 0, t, 0.05);
    engOsc.frequency.setTargetAtTime(38 + spd * 0.45, t, 0.1);
    engLp.frequency.setTargetAtTime(250 + spd * 2.5, t, 0.1);
  }
  function tone(f, dur, type = 'square', vol = 0.25, f2) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function boom(big) {
    if (!ac || muted) return;
    const t = ac.currentTime, dur = big ? 1.2 : 0.45;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(big ? 1600 : 2400, t);
    f.frequency.exponentialRampToValueAtTime(80, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(big ? 0.9 : 0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
  }
  return {
    init, engine, boom,
    shoot: () => tone(1400, 0.12, 'square', 0.12, 300),
    refuel: (lvl) => tone(400 + lvl * 600, 0.06, 'triangle', 0.25),
    alarm: () => tone(880, 0.12, 'square', 0.15),
    life: () => { tone(660, 0.1); setTimeout(() => tone(990, 0.15), 110); },
    toggle: () => { muted = !muted; return muted; },
    get muted() { return muted; },
  };
})();

// ---------- Stan gry ----------
let rows, ents, decos, parts, bullet;
let genSec, scrollY, px, bank, speed, fuel;
let score = 0, lives = 3, checkpoint = 0, bridges = 0, nextLife = 10000;
let state = 'title', stateT = 0, jetT = 5, alarmT = 0, refuelT = 0, time = 0;
let hi = 0;
try { hi = +localStorage.getItem('rzeczny-rajd-hi') || 0; } catch (e) {}

function isWater(x, wy) {
  const r = rows[Math.floor(wy / ROW)];
  if (!r) return true;
  const d = Math.abs(x - CX);
  return d < r.hw && d >= r.iw;
}
function isLand(x, wy) {
  const r = rows[Math.floor(wy / ROW)];
  if (!r) return false;
  const d = Math.abs(x - CX);
  return d > r.hw + 1 || d < r.iw - 1;
}
function fitsWater(x, y, w, h) {
  for (let wy = y; wy <= y + h; wy += ROW / 2) {
    if (!isWater(x - w / 2, wy) || !isWater(x + w / 2, wy)) return false;
  }
  return true;
}
function fitsLand(x, y, w, h) {
  for (let wy = y; wy <= y + h; wy += ROW / 2) {
    if (!isLand(x - w / 2 - 2, wy) || !isLand(x + w / 2 + 2, wy) || !isLand(x, wy)) return false;
  }
  return true;
}

// Każdy odcinek rzeki (od mostu do mostu) jest generowany z własnego ziarna,
// więc po utracie samolotu odcinek wygląda dokładnie tak samo jak poprzednio.
function genSection(k) {
  const R = mulberry32(k * 7919 + 12345);
  const base = rows.length;
  const diff = Math.min(k, 12);
  const len = 200 + diff * 12;
  let hw = BHW, iw = 0, thw = BHW, tiw = 0, hold = 0, lastSpawn = 0;
  const cand = [], dcand = [];

  for (let i = 0; i < len; i++) {
    if (i < 10 || i > len - 30) { thw = BHW; tiw = 0; }
    else if (--hold <= 0) {
      thw = Math.round((56 + R() * 96) / 8) * 8;
      tiw = (k > 0 || i > 60) && thw >= 96 && R() < 0.4
        ? Math.round((16 + R() * (thw - 64)) / 8) * 8 : 0;
      hold = 10 + Math.floor(R() * 30);
    }
    hw += Math.sign(thw - hw) * Math.min(8, Math.abs(thw - hw));
    if (tiw === 0) { iw -= 8; if (iw < 16) iw = 0; }
    else if (iw === 0) iw = 16;
    else iw += Math.sign(tiw - iw) * Math.min(8, Math.abs(tiw - iw));
    if (hw - iw < 44) { iw = hw - 44; if (iw < 16) iw = 0; }
    rows.push({ hw, iw, sec: k, road: false });

    const wy = (base + i) * ROW;

    // dekoracje na lądzie
    if (R() < 0.14) {
      const house = R() < 0.3;
      const spr = house ? SPR.house : SPR.tree;
      const side = R();
      const landW = CX - hw;
      let x = null;
      if (iw >= 28 && side < 0.2) x = CX + (R() * 2 - 1) * (iw - 14);
      else if (landW >= 24) {
        x = 10 + R() * (landW - 20);
        if (side > 0.6) x = W - x;
      }
      if (x !== null) dcand.push({ x, y: wy, spr, w: spr.width, h: spr.height });
    }

    // przeciwnicy i paliwo
    if (i >= 22 && i < len - 32 && i - lastSpawn >= 5 && R() < 0.05 + diff * 0.005) {
      const roll = R();
      const type = roll < 0.22 ? 'fuel' : roll < 0.6 ? 'ship' : 'heli';
      const ew = type === 'fuel' ? 16 : type === 'ship' ? 32 : 24;
      const eh = type === 'fuel' ? 40 : type === 'ship' ? 12 : 16;
      let lo, hi2;
      if (iw === 0) { lo = -hw; hi2 = hw; }
      else if (R() < 0.5) { lo = -hw; hi2 = -iw; }
      else { lo = iw; hi2 = hw; }
      const span = hi2 - lo - ew - 6;
      if (span > 0) {
        const moving = type !== 'fuel' && R() < Math.min(0.2 + k * 0.1, 0.85);
        const dir = R() < 0.5 ? -1 : 1;
        cand.push({
          type, w: ew, h: eh, x: CX + lo + 3 + ew / 2 + R() * span, y: wy,
          moving, active: false, vx: dir * (28 + R() * 30 + diff * 4), face: dir,
          wake: 120 + R() * 140,
        });
        lastSpawn = i;
      }
    }
  }
  // most
  const by = rows.length;
  for (let j = 0; j < 3; j++) rows.push({ hw: BHW, iw: 0, sec: k, road: true });
  // walidacja kandydatów, gdy rzędy powyżej już istnieją
  for (const e of cand) if (fitsWater(e.x, e.y, e.w, e.h)) ents.push(e);
  for (const d of dcand) if (fitsLand(d.x, d.y, d.w, d.h)) decos.push(d);
  ents.push({ type: 'bridge', x: CX, y: by * ROW, w: BHW * 2, h: 3 * ROW, sec: k, moving: false });
}

function ensureRows() {
  while (rows.length * ROW < scrollY + VH + 480) genSection(genSec++);
}

function resetWorld(sec) {
  rows = []; ents = []; decos = []; parts = []; bullet = null;
  genSec = sec; scrollY = 0; px = CX; bank = 0; speed = 80; fuel = 1;
  jetT = 4 + Math.random() * 4;
  ensureRows();
}

function newGame() {
  score = 0; lives = 3; checkpoint = 0; bridges = 0; nextLife = 10000;
  resetWorld(0);
  state = 'ready'; stateT = 0.3;
}

function addScore(n) {
  score += n;
  if (score >= nextLife) { nextLife += 10000; if (lives < 9) { lives++; Snd.life(); } }
  if (score > hi) { hi = score; try { localStorage.setItem('rzeczny-rajd-hi', hi); } catch (e) {} }
}

function explode(x, y, n, big) {
  const cols = ['#ffe060', '#ff9a20', '#e83a1a', '#ffffff', '#606060'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * (big ? 160 : 110);
    parts.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 0.4 + Math.random() * (big ? 1.1 : 0.6),
      c: cols[(Math.random() * cols.length) | 0], s: 2 + ((Math.random() * 3) | 0),
    });
  }
}

function crash() {
  if (state !== 'play') return;
  state = 'dying'; stateT = 2.2; bullet = null;
  explode(px, scrollY + POFF, 60, true);
  Snd.boom(true); Snd.engine(false, 0);
}

function destroy(e) {
  e.dead = true;
  const pts = { ship: 30, heli: 60, fuel: 80, jet: 100, bridge: 500 }[e.type];
  addScore(pts);
  if (e.type === 'bridge') {
    for (let i = 0; i < 6; i++) explode(e.x - e.w / 2 + (i + 0.5) * e.w / 6, e.y + e.h / 2, 12, true);
    checkpoint = e.sec + 1; bridges = Math.max(bridges, e.sec + 1);
    Snd.boom(true);
  } else {
    explode(e.x, e.y + e.h / 2, 24, false);
    Snd.boom(false);
  }
}

const overlap = (ax1, ay1, ax2, ay2, bx1, by1, bx2, by2) =>
  ax1 < bx2 && ax2 > bx1 && ay1 < by2 && ay2 > by1;

// ---------- Logika ----------
function update(dt) {
  time += dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);

  if (state === 'title') {
    scrollY += 40 * dt; ensureRows(); updateEnts(dt, false); cleanup();
    return;
  }
  if (state === 'ready') { stateT -= dt; return; }
  if (state === 'over') { stateT -= dt; return; }
  if (state === 'paused') return;
  if (state === 'dying') {
    stateT -= dt;
    updateEnts(dt, false);
    if (stateT <= 0) {
      lives--;
      if (lives <= 0) { state = 'over'; stateT = 1.2; }
      else { resetWorld(checkpoint); state = 'ready'; stateT = 0.3; }
    }
    return;
  }

  // --- play ---
  const target = keys.up ? 160 : keys.down ? 40 : 80;
  speed += (target - speed) * Math.min(1, dt * 3);
  bank = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  px = clamp(px + bank * 130 * dt, 8, W - 8);
  scrollY += speed * dt;
  ensureRows();
  Snd.engine(true, speed);

  const pwy = scrollY + POFF;

  // paliwo
  fuel -= dt / 32;
  if (fuel < 0.25) {
    alarmT -= dt;
    if (alarmT <= 0) { Snd.alarm(); alarmT = 0.5; }
  }
  if (fuel <= 0) { fuel = 0; crash(); return; }

  // strzał
  if (keys.fire && !bullet) { bullet = { x: px, y: pwy + 10 }; Snd.shoot(); }
  if (bullet) {
    const y0 = bullet.y;
    bullet.y += (460 + speed) * dt;
    for (const e of ents) {
      if (e.dead) continue;
      if (overlap(bullet.x - 1, y0, bullet.x + 1, bullet.y + 8, e.x - e.w / 2, e.y, e.x + e.w / 2, e.y + e.h)) {
        destroy(e); bullet = null; break;
      }
    }
    if (bullet && bullet.y > scrollY + VH + 8) bullet = null;
  }

  // odrzutowce
  if (rows[Math.floor(pwy / ROW)].sec >= 1) {
    jetT -= dt;
    if (jetT <= 0) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const sec = rows[Math.floor(pwy / ROW)].sec;
      ents.push({
        type: 'jet', w: 24, h: 10, x: dir > 0 ? -16 : W + 16,
        y: scrollY + POFF + 140 + Math.random() * 180,
        vx: dir * (110 + Math.min(sec, 10) * 10), face: dir, moving: true, active: true, fly: true,
      });
      jetT = Math.max(2, 7 - sec * 0.4) + Math.random() * 4;
    }
  }

  updateEnts(dt, true);

  // kolizja z lądem
  const pts = [[0, 9], [-8, 1], [8, 1], [-4, -9], [4, -9], [-3, 5], [3, 5]];
  for (const [ox, oy] of pts) {
    if (!isWater(px + ox, pwy + oy)) { crash(); return; }
  }

  // kolizje z obiektami
  let refueling = false;
  for (const e of ents) {
    if (e.dead) continue;
    if (overlap(px - 7, pwy - 8, px + 7, pwy + 8, e.x - e.w / 2 + 2, e.y + 1, e.x + e.w / 2 - 2, e.y + e.h - 1)) {
      if (e.type === 'fuel') refueling = true;
      else { destroy(e); crash(); return; }
    }
  }
  if (refueling && fuel < 1) {
    fuel = Math.min(1, fuel + dt * 0.45);
    refuelT -= dt;
    if (refuelT <= 0) { Snd.refuel(fuel); refuelT = 0.1; }
  }

  cleanup();
}

function updateEnts(dt, live) {
  const pwy = scrollY + POFF;
  for (const e of ents) {
    if (e.dead || !e.moving) continue;
    if (e.fly) { e.x += e.vx * dt; if (e.x < -40 || e.x > W + 40) e.dead = true; continue; }
    if (!e.active) { if (live && e.y - pwy < e.wake) e.active = true; else continue; }
    const nx = e.x + e.vx * dt;
    if (fitsWater(nx, e.y, e.w, e.h)) e.x = nx;
    else { e.vx = -e.vx; e.face = Math.sign(e.vx); }
  }
}

function cleanup() {
  ents = ents.filter(e => !e.dead && e.y + e.h > scrollY - 16);
  decos = decos.filter(d => d.y + d.h > scrollY - 16);
}

// ---------- Rysowanie ----------
function draw() {
  const s = Math.floor(scrollY);
  const sy = wy => VH - (wy - s);

  ctx.fillStyle = LAND; ctx.fillRect(0, 0, W, VH);
  const r0 = Math.max(0, Math.floor(s / ROW)), r1 = Math.min(rows.length - 1, Math.floor((s + VH) / ROW) + 1);
  for (let r = r0; r <= r1; r++) {
    const row = rows[r], top = sy((r + 1) * ROW);
    ctx.fillStyle = WATER;
    if (row.iw === 0) ctx.fillRect(CX - row.hw, top, row.hw * 2, ROW);
    else {
      ctx.fillRect(CX - row.hw, top, row.hw - row.iw, ROW);
      ctx.fillRect(CX + row.iw, top, row.hw - row.iw, ROW);
    }
    // ciemniejszy brzeg
    ctx.fillStyle = '#2f7322';
    ctx.fillRect(CX - row.hw - 3, top, 3, ROW);
    ctx.fillRect(CX + row.hw, top, 3, ROW);
    if (row.iw) { ctx.fillRect(CX - row.iw, top, 3, ROW); ctx.fillRect(CX + row.iw - 3, top, 3, ROW); }
    if (row.road) {
      ctx.fillStyle = ROAD;
      ctx.fillRect(0, top, CX - row.hw, ROW);
      ctx.fillRect(CX + row.hw, top, W - CX - row.hw, ROW);
    }
  }
  // pasy na drodze
  for (let r = r0; r <= r1; r++) {
    const row = rows[r];
    if (row.road && (!rows[r + 1] || !rows[r + 1].road) && rows[r - 1] && rows[r - 1].road) {
      const mid = sy(r * ROW) - 1;
      ctx.fillStyle = '#e8d44d';
      for (let x = 4; x < W; x += 16) {
        if (Math.abs(x + 4 - CX) > row.hw) ctx.fillRect(x, mid, 8, 2);
      }
    }
  }

  for (const d of decos) ctx.drawImage(d.spr, Math.round(d.x - d.w / 2), sy(d.y + d.h));

  for (const e of ents) {
    if (e.dead) continue;
    const x = Math.round(e.x - e.w / 2), y = sy(e.y + e.h);
    if (y > VH || y + e.h < 0) continue;
    switch (e.type) {
      case 'ship': ctx.drawImage(e.face < 0 ? SPR.shipL : SPR.ship, x, y); break;
      case 'heli': {
        const f = Math.floor(time * 14) % 2;
        ctx.drawImage((e.face < 0 ? SPR.heliL : SPR.heli)[f], x, y); break;
      }
      case 'jet': ctx.drawImage(e.face < 0 ? SPR.jetL : SPR.jet, x, y); break;
      case 'fuel': ctx.drawImage(SPR.fuel, x, y); break;
      case 'bridge': drawBridge(x, y, e.w, e.h); break;
    }
  }

  if (bullet) {
    ctx.fillStyle = '#ffe060';
    ctx.fillRect(Math.round(bullet.x) - 1, sy(bullet.y + 8), 2, 8);
  }

  const showPlane = state === 'play' || state === 'paused' || (state === 'ready' && Math.floor(time * 4) % 2 === 0);
  if (showPlane) {
    const w = bank ? 14 : 18;
    ctx.drawImage(SPR.plane, Math.round(px - w / 2), PY - 10, w, 20);
  }

  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x), sy(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;

  drawHud();
  drawOverlay();
}

function drawBridge(x, y, w, h) {
  ctx.fillStyle = '#6a6a6a'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#c8b040';
  ctx.fillRect(x, y, w, 3); ctx.fillRect(x, y + h - 3, w, 3);
  ctx.fillStyle = '#1a1a1a';
  for (let i = x + 2; i < x + w - 2; i += 10) { ctx.fillRect(i, y, 2, 3); ctx.fillRect(i, y + h - 3, 2, 3); }
  ctx.fillStyle = '#e8d44d';
  for (let i = x + 4; i < x + w - 6; i += 14) ctx.fillRect(i, y + h / 2 - 1, 7, 2);
}

function text(str, x, y, size, col, align = 'center') {
  ctx.font = `bold ${size}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; ctx.fillText(str, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}

function drawHud() {
  ctx.fillStyle = '#8a8a8a'; ctx.fillRect(0, VH, W, HUD);
  ctx.fillStyle = '#5a5a5a'; ctx.fillRect(0, VH, W, 2);

  text(String(score).padStart(6, ' '), 60, VH + 18, 16, '#e8d44d');
  text('REKORD ' + hi, 60, VH + 44, 10, '#fff');

  // wskaźnik paliwa
  const gx = 130, gy = VH + 10, gw = 110, gh = 22;
  ctx.fillStyle = '#000'; ctx.fillRect(gx - 2, gy - 2, gw + 4, gh + 4);
  ctx.fillStyle = '#f0f0f0'; ctx.fillRect(gx, gy, gw, gh);
  ctx.fillStyle = '#000';
  for (let i = 0; i <= 4; i++) ctx.fillRect(gx + 4 + i * (gw - 10) / 4, gy + gh - 6, 2, 6);
  text('E', gx + 6, gy + 8, 10, '#000');
  text('1/2', gx + gw / 2 + 1, gy + 8, 9, '#000');
  text('F', gx + gw - 6, gy + 8, 10, '#000');
  const nx = gx + 4 + fuel * (gw - 10);
  ctx.fillStyle = fuel < 0.25 && Math.floor(time * 4) % 2 ? '#ff2020' : '#c01010';
  ctx.fillRect(Math.round(nx), gy, 3, gh);
  text('PALIWO', gx + gw / 2, VH + 46, 10, '#fff');

  // życia i mosty
  for (let i = 0; i < Math.min(lives, 5); i++) ctx.drawImage(SPR.plane, 258 + (i % 3) * 18 - 4, VH + 6 + Math.floor(i / 3) * 0, 12, 14);
  if (lives > 3) text('x' + lives, 300, VH + 13, 10, '#e8d44d');
  text('MOST ' + bridges, 284, VH + 44, 10, '#fff');
  if (Snd.muted) text('♪̸', 312, VH + 30, 10, '#fff');
}

function panel(lines) {
  const h = lines.length * 22 + 24;
  const y0 = VH / 2 - h / 2;
  ctx.fillStyle = 'rgba(0,0,0,.72)';
  ctx.fillRect(24, y0, W - 48, h);
  ctx.strokeStyle = '#e8d44d'; ctx.lineWidth = 2;
  ctx.strokeRect(25, y0 + 1, W - 50, h - 2);
  lines.forEach((l, i) => text(l[0], CX, y0 + 23 + i * 22, l[1] || 12, l[2] || '#fff'));
}

function drawOverlay() {
  const touch = document.body.classList.contains('touch');
  const blink = Math.floor(time * 2) % 2 === 0;
  if (state === 'title') {
    panel([
      ['RZECZNY RAJD', 24, '#e8d44d'],
      ['w hołdzie klasyce z Atari', 10, '#bbb'],
      ['', 8],
      ['Leć w górę rzeki, niszcz statki,', 11],
      ['helikoptery, odrzutowce i mosty.', 11],
      ['Przelatuj nad FUEL, by tankować!', 11, '#ff8080'],
      ['', 8],
      [blink ? (touch ? 'DOTKNIJ, ABY ZACZĄĆ' : 'NACIŚNIJ SPACJĘ') : '', 13, '#e8d44d'],
    ]);
  } else if (state === 'ready') {
    panel([
      [lives === 3 && score === 0 ? 'START!' : 'ZOSTAŁO SAMOLOTÓW: ' + lives, 14, '#e8d44d'],
      [touch ? 'Dotknij przycisku, aby lecieć' : 'Strzałka lub spacja, aby lecieć', 11],
    ]);
  } else if (state === 'paused') {
    panel([['PAUZA', 20, '#e8d44d'], ['P — wznów', 11]]);
  } else if (state === 'over') {
    panel([
      ['KONIEC GRY', 22, '#ff6060'],
      ['WYNIK: ' + score, 14, '#e8d44d'],
      ['MOSTY: ' + bridges + '   REKORD: ' + hi, 11],
      [stateT <= 0 && blink ? (touch ? 'DOTKNIJ, ABY ZAGRAĆ' : 'SPACJA — JESZCZE RAZ') : '', 12, '#e8d44d'],
    ]);
  }
}

// ---------- Sterowanie ----------
const keys = { left: 0, right: 0, up: 0, down: 0, fire: 0 };
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'fire', KeyX: 'fire', KeyJ: 'fire', ControlLeft: 'fire',
};

function action() {
  Snd.init();
  if (state === 'title') { newGame(); state = 'play'; }
  else if (state === 'ready' && stateT <= 0) state = 'play';
  else if (state === 'over' && stateT <= 0) { newGame(); state = 'play'; }
}
function togglePause() {
  if (state === 'play') { state = 'paused'; Snd.engine(false, 0); }
  else if (state === 'paused') state = 'play';
}

addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { keys[k] = 1; e.preventDefault(); if (!e.repeat) action(); }
  else if (e.code === 'Enter' && !e.repeat) action();
  else if (e.code === 'KeyP' && !e.repeat) togglePause();
  else if (e.code === 'KeyM' && !e.repeat) { Snd.init(); Snd.toggle(); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; if (state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = 1; b.classList.add('on'); action(); };
  const off = e => { e.preventDefault(); keys[k] = 0; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'play' || state === 'paused') {
    // dotknięcie paska HUD = pauza
    const r = cv.getBoundingClientRect();
    if ((e.clientY - r.top) / r.height * H > VH) togglePause();
  } else action();
});

function fit() {
  const touch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  document.body.classList.toggle('touch', touch);
  const extra = touch ? 150 : 30;
  const sc = Math.max(0.5, Math.min((innerWidth - 16) / W, (innerHeight - extra - 16) / H));
  cv.style.width = Math.floor(W * sc) + 'px';
  cv.style.height = Math.floor(H * sc) + 'px';
}
addEventListener('resize', fit);
fit();

// ---------- Pętla ----------
resetWorld(0);
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// dla testów
window.__game = {
  get state() { return state; }, get score() { return score; }, get fuel() { return fuel; },
  get bridges() { return bridges; }, get lives() { return lives; }, get px() { return px; },
  get pwy() { return scrollY + POFF; }, isWater, keys,
};
</script>
